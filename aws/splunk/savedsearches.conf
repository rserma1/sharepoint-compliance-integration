# Saved search: refresh Product_Compliance_Infra_Data.csv from the Splunk index.
#
# The sharepoint-compliance-sync Lambda (runs daily at 06:00 UTC) pushes all
# compliance rows to index=pt_prod as sourcetype=sharepoint:compliance.
# This saved search (runs at 07:00 UTC, 1 hour later) deduplicates those events
# and writes them back to the lookup that powers dashboard.xml.
#
# Deploy via:  splunk/deploy_saved_search.sh
# Update via:  POST /servicesNS/nobody/<app>/saved/searches/<name>

[Refresh Product_Compliance_Infra_Data Lookup]
search = index=pt_prod sourcetype="sharepoint:compliance" source="sharepoint_api" earliest=-48h \
    | dedup product feature infrastructure certification sortby -_time \
    | rename product as Product \
            feature as Feature \
            product_area as "Product Area" \
            infrastructure as Infrastructure \
            region as Region \
            category as Category \
            subcategory as Subcategory \
            certification as Certification \
            compliance_status as "Compliance Status" \
            roadmap_quarter as "Roadmap Quarter" \
            notes as "Additional Information (Notes)" \
    | fillnull value="" "Roadmap Quarter" Category Subcategory "Additional Information (Notes)" \
    | table Product Feature "Product Area" Infrastructure Region Category Subcategory \
            Certification "Compliance Status" "Roadmap Quarter" "Additional Information (Notes)" \
    | outputlookup Product_Compliance_Infra_Data.csv
cron_schedule = 0 7 * * *
dispatch.earliest_time = -48h
dispatch.latest_time = now
enableSched = 1
is_scheduled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 0
alert.track = 0
description = Daily refresh of Product_Compliance_Infra_Data.csv lookup from SharePoint compliance events ingested via Lambda HEC. Runs 1 hour after the Lambda (06:00 UTC) to ensure all events are indexed.
