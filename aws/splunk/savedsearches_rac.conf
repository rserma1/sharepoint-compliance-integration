# Saved search: refresh rdmp_reg_aval.csv from the Splunk index.
#
# The sharepoint-rac-sync Lambda (runs daily at 06:00 UTC) pushes all
# Regional Availability rows to index=pt_prod as sourcetype=sharepoint:regional_availability.
# This saved search (runs at 07:00 UTC, 1 hour later) deduplicates those events
# and writes them back to the lookup that powers the RAC dashboard.
#
# Deploy via:  splunk/deploy_saved_search.sh  (add --conf savedsearches_rac.conf support)
# Or manually: paste the SPL below into Splunk UI and save as a scheduled report.

[Refresh rdmp_reg_aval Lookup]
search = index=pt_prod sourcetype="sharepoint:regional_availability" source="sharepoint_api" earliest=-48h \
    | dedup key sortby -_time \
    | rename product_name    as Product_Name \
            feature          as Feature \
            product_feature  as Product_Feature \
            product_area     as Product_Area \
            launch_phase     as Launch_Phase \
            status           as Status \
            target           as Target \
            region_list      as regionList \
            hosting_solution as Hosting_Solution \
            launch_tier      as Launch_Tier \
            key              as Key \
            regions_all      as Regions_All \
            cell_value       as Cell_Value \
    | fillnull value="" Feature Product_Feature \
    | table Product_Name Feature Product_Feature Product_Area \
            Launch_Phase Status Target regionList \
            Hosting_Solution Launch_Tier Key Regions_All Cell_Value \
    | outputlookup rdmp_reg_aval.csv
cron_schedule = 0 7 * * *
dispatch.earliest_time = -48h
dispatch.latest_time = now
enableSched = 1
is_scheduled = 1
counttype = number of events
relation = greater than
quantity = 0
alert.suppress = 0
alert.track = 0
description = Daily refresh of rdmp_reg_aval.csv lookup from SharePoint Regional Availability events ingested via Lambda HEC. Runs 1 hour after the Lambda (06:00 UTC) to ensure all events are indexed.
